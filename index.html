                'PHASE 02: 產學技術對接',

                'PHASE 04: 培育成果驗收'

                nodes.push({ id: p, group: p, importance: 5, desc: p + " 策略核心", source: "系統定義" });
                nodeIds.add(p);
            });

                const id = row[0] ? row[0].toString().trim() : "";
                if (!id || nodeIds.has(id)) return null;

                const cleanGroupLabel = groupLabel.replace(/^\[|\]$/g, "");

                const imp = parseInt(row[2]) || 1;
                const desc = row[3] ? row[3].toString().trim() : "";
                const rawLinks = row[4];

                nodeIds.add(id);
                nodes.push({
                    id: id,
                    group: phase,
                    importance: imp,
                    desc: desc,
                    source: groupLabel.startsWith('[') ? groupLabel : `[${groupLabel}]`
                });

                return { id: id, phase: phase, rawLinks: rawLinks };
            }).filter(d => d !== null);

                links.push({ source: item.phase, target: item.id, label: "歸屬" });

                    const targets = item.rawLinks.toString().split(',');
                    targets.forEach(t => {
                        const targetId = t.trim();
                        if (targetId && nodeIds.has(targetId) && targetId !== item.id) {
                            links.push({ source: item.id, target: targetId, label: "關聯" });
                        }
                    });
                }
            });

            return { nodes, links };
        }

                'PHASE 03: 文化內涵深耕': {

                        '建立樂舞與自媒體校內實習機制，結合流行設計與藝管系推動展演品牌整體包裝。'
                    ],
                    suggestions: '文化深耕是不可替代的競爭護城河（比重 5）。將田調採集成果轉譯為樂舞展演與自媒體品牌，落實校內實習經營，能為學生奠定真正的產業化能力。'
                },
                'PHASE 04: 培育成果驗收': {
                    title: '管理維運與成果驗收',
                    steps: [
                        '健全展演器材、攝影器材與手作道具之定期檢點、保養與借用保管規範。',
                        '彙整證照考照名冊與通過率統計，精準追蹤學生職場證照取得與就業競爭力。',
                        '結合校內外大型展演、Podcast 數位串流發布，完整展現培育成果與社會能見度。'
                    ],
                    suggestions: '成果驗收階段應落實「常態化維運管理與證照名冊追蹤（比重 1~2）」，以實證數據回饋計畫改進，並確保各項展演器材與數位資產能持續循環運作。'
                }
            };

            const phases = [
                { id: 'PHASE 01: 建立學程架構', title: '建立學程架構' },
                { id: 'PHASE 02: 產學技術對接', title: '產學技術對接' },
                { id: 'PHASE 03: 文化內涵深耕', title: '文化內涵深耕' },
                { id: 'PHASE 04: 培育成果驗收', title: '培育成果驗收' }
            ];

            // 嚴格落實一對一去識別化函數
            const deIdentify = (text) => {
                if (!text) return "";
                return text.toString().trim()
                    .replace(/\d{3}年度/g, "年度")
                    .replace(/\d{3}年/g, "年度")
                    .replace(/樹德科技大學/g, "科技大學")
                    .replace(/樹德科大/g, "科大")
                    .replace(/輔仁大學/g, "示範科技大學")
                    .replace(/輔大/g, "科大")
                    .replace(/"/g, "");
            };

            const parseSheetData = (rows) => {
                const nodes = [];
                const links = [];
                const nodeIds = new Set();
                
                const phaseList = ['PHASE 01: 建立學程架構', 'PHASE 02: 產學技術對接', 'PHASE 03: 文化內涵深耕', 'PHASE 04: 培育成果驗收'];
                phaseList.forEach(p => {
                    nodes.push({ id: p, group: p, importance: 5, desc: p + " 策略核心", source: "系統定義" });
                    nodeIds.add(p);
                });

                const rawData = rows.map(row => {
                    const values = Array.isArray(row) ? row : Object.values(row);
                    const cleanId = deIdentify(row['關鍵詞 (ID)'] || values[0]);
                    if (!cleanId || nodeIds.has(cleanId)) return null;

                    const groupLabel = (row['所屬分類 (Group)'] || values[1] || "").toString().trim();
                    const cleanGroup = groupLabel.replace(/^\[|\]$/g, "");
                    const phase = groupToPhase[groupLabel] || groupToPhase[cleanGroup] || 'PHASE 01: 建立學程架構';

                    const impVal = row['比重 (Importance)'] || values[2];
                    const descVal = row['特性說明'] || values[3];
                    const linksVal = row['鏈結關係建議 (Links)'] || values[4];

                    nodeIds.add(cleanId);
                    nodes.push({
                        id: cleanId,
                        group: phase,
                        importance: parseInt(impVal) || 1,
                        desc: deIdentify(descVal),
                        source: groupLabel.startsWith('[') ? groupLabel : `[${groupLabel}]`
                    });

                    return { id: cleanId, phase: phase, rawLinks: linksVal };
                }).filter(d => d !== null);

                rawData.forEach(item => {
                    links.push({ source: item.phase, target: item.id, label: "歸屬" });
                    if (item.rawLinks) {
                        const targets = item.rawLinks.toString().split(',');
                        targets.forEach(t => {
                            const targetId = deIdentify(t.trim());
                            if (targetId && nodeIds.has(targetId) && targetId !== item.id) {
                                links.push({ source: item.id, target: targetId, label: "關聯" });
                            }
                        });
                    }
                });

                return { nodes, links };
            };

            useEffect(() => {
                // 直接向 Google 試算表拉取即時 CSV（免透過 GAS，支援 GitHub Pages 即時同步）
                const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/17xgU7D08XMKytbgzDQx9-kxOC7eM59QqGklAGN4FTVM/gviz/tq?tqx=out:csv';
                
                d3.csv(sheetCsvUrl)
                    .then(rows => {
                        if (rows && rows.length > 0) {
                            const parsed = parseSheetData(rows);
                            if (parsed.nodes && parsed.nodes.length > 4) {
                                setData(parsed);
                                setLoading(false);
                                return;
                            }
                        }
                        throw new Error("試算表資料為空");
                    })
                    .catch(err => {
                        console.warn("直接載入試算表失敗，使用科技大學備用展示資料:", err);
                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run
                                .withSuccessHandler((res) => {
                                    try {
                                        const parsed = JSON.parse(res);
                                        if (parsed.error || !parsed.nodes || parsed.nodes.length === 0) {
                                            setData(fallbackData);
                                        } else {
                                            setData(parsed);
                                        }
                                    } catch (e) {
                                        setData(fallbackData);
                                    }
                                    setLoading(false);
                                })
                                .withFailureHandler(() => {
                                    setData(fallbackData);
                                    setLoading(false);
                                })
                                .getSpreadsheetData();
                        } else {
                            setData(fallbackData);
                            setLoading(false);
                        }
                    });
            }, []);

            // ==========================================
            // 🛡️ 核心繪圖生命週期 (僅在數據初始化或重載時執行一次)
            // ==========================================
            useEffect(() => {
                if (!data || !svgRef.current || data.nodes.length === 0) return;

                try {
                    const width = window.innerWidth;
                    const height = window.innerHeight;
                    
                    const svg = d3.select(svgRef.current)
                        .attr("width", width)
                        .attr("height", height);
                    svg.selectAll("*").remove();
                    svgSelectRef.current = svg;

                    const g = svg.append("g");
                    
                    const zoom = d3.zoom()
                        .scaleExtent([0.15, 3])
                        .on("zoom", (e) => g.attr("transform", e.transform));
                    svg.call(zoom);
                    zoomRef.current = zoom;

                    // 深度複製防React污染
                    const nodes = data.nodes.map(d => ({ ...d }));
                    const links = data.links.map(d => ({ ...d }));
                    nodesDataRef.current = nodes;

                    // 檢查過濾幽靈連線
                    const nodeIds = new Set(nodes.map(n => n.id));
                    const safeLinks = links.filter(l => {
                        const sId = typeof l.source === 'object' ? l.source.id : l.source;
                        const tId = typeof l.target === 'object' ? l.target.id : l.target;
                        return nodeIds.has(sId) && nodeIds.has(tId);
                    });

                    // 物理引擎設定
                    const simulation = d3.forceSimulation(nodes)
                        .force("link", d3.forceLink(safeLinks).id(d => d.id).distance(220))
                        .force("charge", d3.forceManyBody().strength(-2800))
                        .force("center", d3.forceCenter(width * (isSidebarOpen ? 0.62 : 0.5), height / 2))
                        .force("collision", d3.forceCollide().radius(75));
                    simRef.current = simulation;

                    // 渲染連線 (淡灰線，添加 transition 提升聯動平滑感)
                    const link = g.append("g").selectAll("line")
                        .data(safeLinks)
                        .join("line")
                        .attr("stroke", "#cbd5e1")
                        .attr("stroke-opacity", 0.75)
                        .attr("stroke-width", 1.5)
                        .style("transition", "opacity 0.4s ease");
                    linkSelectionRef.current = link;

                    // 渲染連線關係文字
                    const linkLabel = g.append("g").selectAll("text")
                        .data(safeLinks)
                        .join("text")
                        .attr("class", "link-label")
                        .attr("text-anchor", "middle")
                        .text(d => d.label || "關聯")
                        .style("transition", "opacity 0.4s ease");
                    linkLabelSelectionRef.current = linkLabel;

                    // 渲染節點組
                    const node = g.append("g").selectAll("g")
                        .data(nodes)
                        .join("g")
                        .style("cursor", "pointer")
                        .style("transition", "opacity 0.4s ease")
                        .call(d3.drag()
                            .on("start", (e, d) => { 
                                if (!e.active) simulation.alphaTarget(0.3).restart(); 
                                d.fx = d.x; d.fy = d.y; 
                            })
                            .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                            .on("end", (e, d) => { 
                                if (!e.active) simulation.alphaTarget(0); 
                                d.fx = null; d.fy = null; 
                            }))
                        .on("click", (e, d) => { 
                            e.stopPropagation(); 
                            setSelectedNode(d); 
                        });
                    nodeSelectionRef.current = node;

                    const colors = {
                        'PHASE 01: 建立學程架構': '#2563eb', // 皇家藍
                        'PHASE 02: 產學技術對接': '#059669', // 翡翠綠
                        'PHASE 03: 文化內涵深耕': '#db2777', // 玫瑰粉
                        'PHASE 04: 培育成果驗收': '#FFA500'  // 橘色
                    };

                    node.append("circle")
                        .attr("r", d => d.importance * 7 + 10)
                        .attr("fill", d => colors[d.group] || "#475569")
                        .attr("stroke", d => d.importance > 4 ? "#d97706" : "#ffffff") 
                        .attr("stroke-width", d => d.importance > 4 ? 3 : 1.5);

                    node.append("text")
                        .text(d => d.id)
                        .attr("text-anchor", "middle")
                        .attr("dy", ".3em")
                        .attr("class", "node-label");

                    simulation.on("tick", () => {
                        link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                            .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                        
                        linkLabel
                            .attr("x", d => (d.source.x + d.target.x) / 2)
                            .attr("y", d => (d.source.y + d.target.y) / 2);

                        node.attr("transform", d => `translate(${d.x},${d.y})`);
                    });

                    // 初始加載時置中縮放
                    const initScale = 0.75;
                    svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(initScale));

                } catch (err) {
                    console.error("D3 渲染失敗：", err);
                    setError("圖譜引擎解析異常：" + err.message);
                }
            }, [data]);

            // ==========================================
            // 🎯 PHASE / SIDEBAR 點擊聯動自動位移與對焦核心
            // ==========================================
            useEffect(() => {
                if (!data || !svgSelectRef.current || !zoomRef.current || !nodesDataRef.current.length) return;

                const width = window.innerWidth;
                const height = window.innerHeight;
                const svg = svgSelectRef.current;
                const zoom = zoomRef.current;
                const nodes = nodesDataRef.current;
                
                const node = nodeSelectionRef.current;
                const link = linkSelectionRef.current;
                const linkLabel = linkLabelSelectionRef.current;

                if (!node || !link || !linkLabel) return;

                // 動態微調力學中樞重力，適應側邊欄寬度變化
                if (simRef.current) {
                    simRef.current.force("center", d3.forceCenter(width * (isSidebarOpen ? 0.62 : 0.5), height / 2));
                    simRef.current.alpha(0.08).restart(); // 微調讓重心平滑過渡
                }

                if (activePhase) {
                    // 1. 高亮核心階段節點與關聯，其餘淡出
                    node.style("opacity", d => d.group === activePhase ? 1 : 0.05);
                    link.style("opacity", d => d.source.group === activePhase && d.target.group === activePhase ? 1 : 0.01);
                    linkLabel.style("opacity", d => d.source.group === activePhase && d.target.group === activePhase ? 1 : 0);

                    // 2. 獲取當前高亮階段的「中樞大節點」
                    const phaseHubNode = nodes.find(n => n.id === activePhase);
                    if (phaseHubNode) {
                        const targetScale = 1.15; // 置中並放大對焦
                        const centerOffsetX = width * (isSidebarOpen ? 0.62 : 0.5);
                        const centerOffsetY = height / 2;

                        // 計算平移轉換矩陣
                        const targetX = centerOffsetX - phaseHubNode.x * targetScale;
                        const targetY = centerOffsetY - phaseHubNode.y * targetScale;

                        svg.transition()
                            .duration(1200)
                            .ease(d3.easeCubicInOut)
                            .call(zoom.transform, d3.zoomIdentity.translate(targetX, targetY).scale(targetScale));
                    }
                } else {
                    // 恢復全視角
                    node.style("opacity", 1);
                    link.style("opacity", 0.65);
                    linkLabel.style("opacity", 1);

                    const scale = 0.75;
                    const centerOffsetX = width * (isSidebarOpen ? 0.62 : 0.5);
                    const centerOffsetY = height / 2;

                    svg.transition()
                        .duration(1000)
                        .ease(d3.easeCubicInOut)
                        .call(zoom.transform, d3.zoomIdentity.translate(centerOffsetX - (width * 0.5) * scale, centerOffsetY - (height * 1.9 / 4) * scale).scale(scale));
                }
            }, [activePhase, isSidebarOpen, data]);

            // ==========================================
            // 🎯 點擊單個關聯節點，飛入精確對焦
            // ==========================================
            useEffect(() => {
                if (!selectedNode || !svgSelectRef.current || !zoomRef.current || !nodesDataRef.current.length) return;

                const width = window.innerWidth;
                const height = window.innerHeight;
                const svg = svgSelectRef.current;
                const zoom = zoomRef.current;
                const nodes = nodesDataRef.current;

                const targetNode = nodes.find(n => n.id === selectedNode.id);
                if (targetNode) {
                    const focusScale = 1.35; // 極致對焦放大倍率
                    const centerOffsetX = width * (isSidebarOpen ? 0.62 : 0.5);
                    const centerOffsetY = height / 2;

                    const targetX = centerOffsetX - targetNode.x * focusScale;
                    const targetY = centerOffsetY - targetNode.y * focusScale;

                    svg.transition()
                        .duration(1100)
                        .ease(d3.easeCubicInOut)
                        .call(zoom.transform, d3.zoomIdentity.translate(targetX, targetY).scale(focusScale));
                }
            }, [selectedNode]);

            // ==========================================
            // 📄 白話版策略診斷報告分析與 Word 匯出邏輯
            // ==========================================
            const generateReportDetails = (inputData) => {
                if (!inputData || !inputData.nodes) return null;
                const userNodes = inputData.nodes.filter(n => n.source !== '系統定義');
                const totalNodes = userNodes.length;
                if (totalNodes === 0) return null;

                const phaseNames = [
                    'PHASE 01: 建立學程架構',
                    'PHASE 02: 產學技術對接',
                    'PHASE 03: 文化內涵深耕',
                    'PHASE 04: 培育成果驗收'
                ];

                const phaseStats = phaseNames.map((p, idx) => {
                    const nodes = userNodes.filter(n => n.group === p);
                    const count = nodes.length;
                    const score = nodes.reduce((sum, n) => sum + (n.importance || 1), 0);
                    return {
                        phase: p,
                        phaseIdx: idx + 1,
                        title: p.split(':')[1]?.trim() || p,
                        count,
                        score,
                        nodes
                    };
                });

                const totalScore = phaseStats.reduce((sum, p) => sum + p.score, 0) || 1;
                phaseStats.forEach(p => {
                    p.ratio = Math.round((p.score / totalScore) * 100);
                });

                // 核心優勢 (比重 4~5)
                const topAssets = userNodes.filter(n => n.importance >= 4).sort((a,b) => b.importance - a.importance);
                const topAssetsRatio = Math.round((topAssets.length / totalNodes) * 100);

                // 判定當前成熟度階段
                let currentStage = phaseStats[0];
                let stageReason = '';

                const p4High = phaseStats[3].nodes.filter(n => n.importance >= 4).length;
                const p3High = phaseStats[2].nodes.filter(n => n.importance >= 4).length;
                const p2High = phaseStats[1].nodes.filter(n => n.importance >= 4).length;

                if (phaseStats[3].ratio >= 25 && p4High >= 2) {
                    currentStage = phaseStats[3];
                    stageReason = '貴校在「培育成果驗收」已有成熟的展演經營、自媒體串流發布與考照通過率名冊統計，已進入第四階段成熟典範期。';
                } else if (phaseStats[2].ratio >= 25 && p3High >= 2) {
                    currentStage = phaseStats[2];
                    stageReason = '貴校在「文化內涵深耕」累積了扎實的原夢創課基地實習、樂舞展演實務與南島國際交流，實習與文化護城河鮮明，正處於第三階段實習展演深耕期。';
                } else if (phaseStats[1].ratio >= 25 || p2High >= 2) {
                    currentStage = phaseStats[1];
                    stageReason = '貴校已具備原子職能證照輔導班、自媒體與 Podcast 實戰課程及新媒體行銷管理師認證，證照與自媒體實作能量顯著，正處於第二階段產學技術深化期。';
                } else {
                    currentStage = phaseStats[0];
                    stageReason = '貴校過去三年的重心主要在原資中心行政中樞、高教深耕計畫與一生四師陪伴機制，屬於打底扎根階段，正處於第一階段學程架構奠基期。';
                }

                // 基礎維持與動員 (比重 1~2)
                const lowWeightNodes = userNodes.filter(n => n.importance <= 2);
                const lowWeightRatio = Math.round((lowWeightNodes.length / totalNodes) * 100);

                // ==========================================
                // 🧭 SWOT 分析模組建構
                // ==========================================

                // 1. S (Strengths 內部優勢)
                const strengths = [
                    {
                        title: `高階核心專業資產深厚（比重 4~5 共 ${topAssets.length} 項，佔 ${topAssetsRatio}%）`,
                        desc: `包含「${topAssets.slice(0, 3).map(a => a.id).join('」、「')}」等比重 4~5 之旗艦核心項目，具備扎實實作技術門檻與不易被複製的教學特色。`,
                        tag: '核心資產'
                    },
                    {
                        title: `深耕「${currentStage.title}」特色鮮明（權重佔比 ${currentStage.ratio}%）`,
                        desc: `全校在該階段投放了高達 ${currentStage.score} 分之策略權重與實質資源，展現清晰明確的發展重心與垂直整合動能。`,
                        tag: '策略重心'
                    },
                    {
                        title: '跨系跨域整合與自媒體實習場域健全',
                        desc: '已成功打通表演藝術、流行設計、視傳、動遊與藝管系所壁壘，具備原夢創課基地與自媒體實務實習機制，形成共構生態。',
                        tag: '組織協同'
                    }
                ];

                // 2. W (Weaknesses 內部劣勢)
                const weaknesses = [];
                if (lowWeightRatio > 35) {
                    weaknesses.push({
                        title: `行政維持與庶務成本偏高（比重 1~2 佔 ${lowWeightRatio}%）`,
                        desc: `全校共有 ${lowWeightNodes.length} 項屬於報銷、行政瑣務或日常維運項目，顯示行政與庶務負擔較重，容易稀釋專任師資投入高階專案與產學實習的心力。`,
                        tag: '行政負荷'
                    });
                }
                if (phaseStats[3].count < 3 || p4High === 0) {
                    weaknesses.push({
                        title: '成果驗收與成果指標尚待擴充',
                        desc: '第四階段（如器材系統化管理、對外大型常態發表、考照率名冊回饋校務 IR）之項目偏少，外部評鑑與社會大眾不易直觀看見培育的長期累積指標。',
                        tag: '產出斷鏈'
                    });
                }
                if (phaseStats[2].count < 3 || p3High === 0) {
                    weaknesses.push({
                        title: '實習經營與跨域展演深度仍有深化空間',
                        desc: '若技術操作比例過高而創課基地提案與南島國際展演交流比例偏低，容易缺乏文化主體性與不可替代的品牌技術護城河。',
                        tag: '實習深耕'
                    });
                }
                if (weaknesses.length === 0) {

                                                                <span className="font-extrabold text-xs text-amber-950">{t.title}</span>
                                                                <span className="text-[9px] font-black text-amber-700 bg-amber-50 px-2 py-0.5 rounded">{t.tag}</span>
                                                            </div>
                                                            <p className="text-[11.5px] text-slate-600 leading-relaxed font-medium">{t.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                    {/* 第三章：SWOT 四大面向深度剖析 */}
                                    <div className="space-y-6">
                                        <h3 className="text-base font-black text-slate-800 flex items-center gap-2">
                                            <span>🔍</span> 三、SWOT 四大構面深度剖析（白話解讀）
                                        </h3>

                                        {/* 3.1 核心優勢資產清單 */}
                                        <div className="p-5.5 bg-slate-50 border border-slate-200/80 rounded-3xl">
                                            <h4 className="text-sm font-black text-slate-800 mb-2 flex items-center gap-2">
                                                <span className="text-emerald-500">🌟</span> 3.1 核心優勢（Strengths）：高權重核心資產與競爭護城河
                                            </h4>
                                            <p className="text-xs text-slate-500 font-semibold mb-4">
                                                全校共有 <strong>{reportData.topAssets.length} 項高權重核心資產（比重 4~5，佔 {reportData.topAssetsRatio}%）</strong>，這是貴校歷年積累最深厚、不可輕易被其他院校複製的核心護城河：
                                            </p>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {reportData.topAssets.map((a, idx) => (
                                                    <div key={idx} className="p-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm">
                                                        <div className="flex items-center justify-between mb-1.5">
                                                            <span className="font-black text-[13.5px] text-slate-800">{a.id}</span>
                                                            <span className="text-[10px] font-black bg-rose-600 text-white px-2 py-0.5 rounded-full">比重 {a.importance}</span>
                                                        </div>
                                                        <p className="text-xs text-slate-600 leading-relaxed font-medium">"{a.desc || '核心優勢項目'}"</p>
                                                        <span className="text-[10px] font-bold text-slate-400 mt-2 block">分類：{a.source || a.group.split(':')[0]}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 3.2 劣勢與瓶頸 */}
                                        <div className="p-5.5 bg-slate-50 border border-slate-200/80 rounded-3xl">
                                            <h4 className="text-sm font-black text-slate-800 mb-2 flex items-center gap-2">
                                                <span className="text-rose-500">⚠️</span> 3.2 內部短板（Weaknesses）：結構性瓶頸診斷
                                            </h4>
                                            <p className="text-xs text-slate-500 font-semibold mb-3">
                                                客觀檢視貴校現有資源拓撲結構，若要邁向下一個成熟位階，建議檢視以下短板：
                                            </p>
                                            <div className="space-y-2.5">
                                                {reportData.swot.weaknesses.map((w, idx) => (
                                                    <div key={idx} className="p-3.5 bg-white border border-rose-100 rounded-2xl">
                                                        <h5 className="font-extrabold text-xs text-rose-800">{w.title}</h5>
                                                        <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{w.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 3.3 外部機會 */}
                                        <div className="p-5.5 bg-slate-50 border border-slate-200/80 rounded-3xl">
                                            <h4 className="text-sm font-black text-slate-800 mb-2 flex items-center gap-2">
                                                <span className="text-blue-500">🚀</span> 3.3 外部機會（Opportunities）：政策紅利與時代利基
                                            </h4>
                                            <p className="text-xs text-slate-500 font-semibold mb-3">
                                                結合教育部高教深耕計畫、技專校院產業實作基地與自媒體新創需求，貴校可掌握以下重要機會：
                                            </p>
                                            <div className="space-y-2.5">
                                                {reportData.swot.opportunities.map((o, idx) => (
                                                    <div key={idx} className="p-3.5 bg-white border border-blue-100 rounded-2xl">
                                                        <h5 className="font-extrabold text-xs text-blue-900">{o.title}</h5>
                                                        <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{o.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 3.4 外部威脅 */}
                                        <div className="p-5.5 bg-slate-50 border border-slate-200/80 rounded-3xl">
                                            <h4 className="text-sm font-black text-slate-800 mb-2 flex items-center gap-2">
                                                <span className="text-amber-500">🛡️</span> 3.4 外部威脅（Threats）：潛在營運風險預警
                                            </h4>
                                            <p className="text-xs text-slate-500 font-semibold mb-3">
                                                面對少子化浪潮、設備損耗維護費用與專案補助變動，貴校應超前部署防範以下風險：
                                            </p>
                                            <div className="space-y-2.5">
                                                {reportData.swot.threats.map((t, idx) => (
                                                    <div key={idx} className="p-3.5 bg-white border border-amber-100 rounded-2xl">
                                                        <h5 className="font-extrabold text-xs text-amber-900">{t.title}</h5>
                                                        <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{t.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                    </div>

                                    {/* 第四章：SWOT 交叉策略矩陣與突破行動方針 */}
                                    <div>
                                        <h3 className="text-base font-black text-slate-800 mb-1 flex items-center gap-2">
                                            <span>🎯</span> 四、SWOT 交叉策略矩陣與突破行動方針（SO / WO / ST / WT 方案）
                                        </h3>
                                        <p className="text-xs text-slate-500 font-semibold mb-4">
                                            將內部優劣勢（S/W）與外部機遇威脅（O/T）進行交叉比對，制定四大維度落地執行方針：
                                        </p>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            
                                            {/* SO 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-emerald-50/80 to-white border border-emerald-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-emerald-600 text-white rounded-lg text-xs font-black">SO</span>
                                                    <h4 className="font-black text-sm text-emerald-950">增長突破策略（發揮優勢 · 把握機會）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.so.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-emerald-100">
                                                            <h5 className="font-extrabold text-xs text-emerald-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* WO 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-blue-50/80 to-white border border-blue-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-blue-600 text-white rounded-lg text-xs font-black">WO</span>
                                                    <h4 className="font-black text-sm text-blue-950">翻轉改善策略（克服劣勢 · 把握機會）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.wo.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-blue-100">
                                                            <h5 className="font-extrabold text-xs text-blue-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* ST 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-amber-50/80 to-white border border-amber-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-amber-600 text-white rounded-lg text-xs font-black">ST</span>
                                                    <h4 className="font-black text-sm text-amber-950">避險多元策略（發揮優勢 · 化解威脅）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.st.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-amber-100">
                                                            <h5 className="font-extrabold text-xs text-amber-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* WT 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-rose-50/80 to-white border border-rose-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-rose-600 text-white rounded-lg text-xs font-black">WT</span>
                                                    <h4 className="font-black text-sm text-rose-950">精實防禦策略（精實劣勢 · 迴避威脅）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.wt.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-rose-100">
                                                            <h5 className="font-extrabold text-xs text-rose-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                </div>

                                {/* Modal 底部操作按鈕 */}
                                <div className="p-4 px-8 border-t border-slate-100 bg-slate-50 flex items-center justify-between no-print">
                                    <span className="text-xs text-slate-400 font-bold">全校節點總計：{reportData.totalNodes} 筆</span>
                                    <div className="flex gap-2.5">
                                        <button 
                                            onClick={() => setShowReportModal(false)}
                                            className="py-2.5 px-4 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-xl font-bold text-xs transition-all"
                                        >
                                            關閉預覽
                                        </button>
                                        <button 
                                            onClick={handleDownloadWord}
                                            className="py-2.5 px-5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-black text-xs shadow-md transition-all flex items-center gap-1.5"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                            下載完整 Word 報告 (.doc)
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
