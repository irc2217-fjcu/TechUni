                        }
                        throw new Error("試算表資料為空");
                    })
                    .catch(err => {
                        console.warn("直接載入試算表失敗，使用科技大學備用展示資料:", err);
                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run
                                .withSuccessHandler((res) => {
                                    try {
                                        const parsed = JSON.parse(res);
                                        if (parsed.error || !parsed.nodes || parsed.nodes.length === 0) {
                                            setData(fallbackData);
                                        } else {
                                            setData(parsed);
                                        }
                                    } catch (e) {
                                        setData(fallbackData);
                                    }
                                    setLoading(false);
                                })
                                .withFailureHandler(() => {
                                    setData(fallbackData);
                                    setLoading(false);
                                })
                                .getSpreadsheetData();
                        } else {
                            setData(fallbackData);
                            setLoading(false);
                        }
                    });
            }, []);

            // ==========================================
            // 🛡️ 核心繪圖生命週期 (僅在數據初始化或重載時執行一次)
            // ==========================================
            useEffect(() => {
                if (!data || !svgRef.current || data.nodes.length === 0) return;

                try {
                    const width = window.innerWidth;
                    const height = window.innerHeight;
                    
                    const svg = d3.select(svgRef.current)
                        .attr("width", width)
                        .attr("height", height);
                    svg.selectAll("*").remove();
                    svgSelectRef.current = svg;

                    const g = svg.append("g");
                    
                    const zoom = d3.zoom()
                        .scaleExtent([0.15, 3])
                        .on("zoom", (e) => g.attr("transform", e.transform));
                    svg.call(zoom);
                    zoomRef.current = zoom;

                    // 深度複製防React污染
                    const nodes = data.nodes.map(d => ({ ...d }));
                    const links = data.links.map(d => ({ ...d }));
                    nodesDataRef.current = nodes;

                    // 檢查過濾幽靈連線
                    const nodeIds = new Set(nodes.map(n => n.id));
                    const safeLinks = links.filter(l => {
                        const sId = typeof l.source === 'object' ? l.source.id : l.source;
                        const tId = typeof l.target === 'object' ? l.target.id : l.target;
                        return nodeIds.has(sId) && nodeIds.has(tId);
                    });

                    // 物理引擎設定
                    const simulation = d3.forceSimulation(nodes)
                        .force("link", d3.forceLink(safeLinks).id(d => d.id).distance(220))
                        .force("charge", d3.forceManyBody().strength(-2800))
                        .force("center", d3.forceCenter(width * (isSidebarOpen ? 0.62 : 0.5), height / 2))
                        .force("collision", d3.forceCollide().radius(75));
                    simRef.current = simulation;

                    // 渲染連線 (淡灰線，添加 transition 提升聯動平滑感)
                    const link = g.append("g").selectAll("line")
                        .data(safeLinks)
                        .join("line")
                        .attr("stroke", "#cbd5e1")
                        .attr("stroke-opacity", 0.75)
                        .attr("stroke-width", 1.5)
                        .style("transition", "opacity 0.4s ease");
                    linkSelectionRef.current = link;

                    // 渲染連線關係文字
                    const linkLabel = g.append("g").selectAll("text")
                        .data(safeLinks)
                        .join("text")
                        .attr("class", "link-label")
                        .attr("text-anchor", "middle")
                        .text(d => d.label || "關聯")
                        .style("transition", "opacity 0.4s ease");
                    linkLabelSelectionRef.current = linkLabel;

                    // 渲染節點組
                    const node = g.append("g").selectAll("g")
                        .data(nodes)
                        .join("g")
                        .style("cursor", "pointer")
                        .style("transition", "opacity 0.4s ease")
                        .call(d3.drag()
                            .on("start", (e, d) => { 
                                if (!e.active) simulation.alphaTarget(0.3).restart(); 
                                d.fx = d.x; d.fy = d.y; 
                            })
                            .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                            .on("end", (e, d) => { 
                                if (!e.active) simulation.alphaTarget(0); 
                                d.fx = null; d.fy = null; 
                            }))
                        .on("click", (e, d) => { 
                            e.stopPropagation(); 
                            setSelectedNode(d); 
                        });
                    nodeSelectionRef.current = node;

                    const colors = {
                        'PHASE 01: 建立技職學程架構': '#2563eb', // 皇家藍
                        'PHASE 02: 雙師協同與產學共構': '#059669', // 翡翠綠
                        'PHASE 03: 實務專題在地轉譯': '#db2777', // 玫瑰粉
                        'PHASE 04: 技職典範與職涯對接': '#FFA500'  // 橘色
                    };

                    node.append("circle")
                        .attr("r", d => d.importance * 7 + 10)
                        .attr("fill", d => colors[d.group] || "#475569")
                        .attr("stroke", d => d.importance > 4 ? "#d97706" : "#ffffff") 
                        .attr("stroke-width", d => d.importance > 4 ? 3 : 1.5);

                    node.append("text")
                        .text(d => d.id)
                        .attr("text-anchor", "middle")
                        .attr("dy", ".3em")
                        .attr("class", "node-label");

                    simulation.on("tick", () => {
                        link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                            .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                        
                        linkLabel
                            .attr("x", d => (d.source.x + d.target.x) / 2)
                            .attr("y", d => (d.source.y + d.target.y) / 2);

                        node.attr("transform", d => `translate(${d.x},${d.y})`);

                    // 初始加載時置中縮放
                    const initScale = 0.75;
                    svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(initScale));

                } catch (err) {
                    console.error("D3 渲染失敗：", err);
                    setError("圖譜引擎解析異常：" + err.message);

            }, [data]);

            // ==========================================
            // 🎯 PHASE / SIDEBAR 點擊聯動自動位移與對焦核心
            // ==========================================
            useEffect(() => {
                if (!data || !svgSelectRef.current || !zoomRef.current || !nodesDataRef.current.length) return;

                const width = window.innerWidth;
                const height = window.innerHeight;
                const svg = svgSelectRef.current;
                const zoom = zoomRef.current;
                const nodes = nodesDataRef.current;
                
                const node = nodeSelectionRef.current;
                const link = linkSelectionRef.current;

                    const phaseHubNode = nodes.find(n => n.id === activePhase);

                        const targetY = centerOffsetY - phaseHubNode.y * targetScale;

                            .ease(d3.easeCubicInOut)

                    const centerOffsetY = height / 2;

                        .duration(1000)
                        .ease(d3.easeCubicInOut)

                                                        <h5 className="font-extrabold text-xs text-amber-900">{t.title}</h5>
                                                        <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{t.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                    </div>

                                    {/* 第四章：SWOT 交叉策略矩陣與突破行動方針 */}
                                    <div>
                                        <h3 className="text-base font-black text-slate-800 mb-1 flex items-center gap-2">
                                            <span>🎯</span> 四、SWOT 交叉策略矩陣與突破行動方針（SO / WO / ST / WT 方案）
                                        </h3>
                                        <p className="text-xs text-slate-500 font-semibold mb-4">
                                            將內部優劣勢（S/W）與外部機遇威脅（O/T）進行交叉比對，制定四大維度落地執行方針：
                                        </p>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            
                                            {/* SO 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-emerald-50/80 to-white border border-emerald-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-emerald-600 text-white rounded-lg text-xs font-black">SO</span>
                                                    <h4 className="font-black text-sm text-emerald-950">增長突破策略（發揮優勢 · 把握機會）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.so.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-emerald-100">
                                                            <h5 className="font-extrabold text-xs text-emerald-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* WO 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-blue-50/80 to-white border border-blue-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-blue-600 text-white rounded-lg text-xs font-black">WO</span>
                                                    <h4 className="font-black text-sm text-blue-950">翻轉改善策略（克服劣勢 · 把握機會）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.wo.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-blue-100">
                                                            <h5 className="font-extrabold text-xs text-blue-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* ST 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-amber-50/80 to-white border border-amber-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-amber-600 text-white rounded-lg text-xs font-black">ST</span>
                                                    <h4 className="font-black text-sm text-amber-950">避險多元策略（發揮優勢 · 化解威脅）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.st.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-amber-100">
                                                            <h5 className="font-extrabold text-xs text-amber-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* WT 策略 */}
                                            <div className="p-5 bg-gradient-to-br from-rose-50/80 to-white border border-rose-200 rounded-3xl shadow-sm">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="p-1.5 bg-rose-600 text-white rounded-lg text-xs font-black">WT</span>
                                                    <h4 className="font-black text-sm text-rose-950">精實防禦策略（精實劣勢 · 迴避威脅）</h4>
                                                </div>
                                                <div className="space-y-3">
                                                    {reportData.swot.crossStrategies.wt.map((item, idx) => (
                                                        <div key={idx} className="p-3.5 bg-white rounded-2xl border border-rose-100">
                                                            <h5 className="font-extrabold text-xs text-rose-900">{item.title}</h5>
                                                            <p className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{item.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                </div>

                                {/* Modal 底部操作按鈕 */}
                                <div className="p-4 px-8 border-t border-slate-100 bg-slate-50 flex items-center justify-between no-print">
                                    <span className="text-xs text-slate-400 font-bold">全校節點總計：{reportData.totalNodes} 筆</span>
                                    <div className="flex gap-2.5">
                                        <button 
                                            onClick={() => setShowReportModal(false)}
                                            className="py-2.5 px-4 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-xl font-bold text-xs transition-all"
                                        >
                                            關閉預覽
                                        </button>
                                        <button 
                                            onClick={handleDownloadWord}
                                            className="py-2.5 px-5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-black text-xs shadow-md transition-all flex items-center gap-1.5"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                            下載完整 Word 報告 (.doc)
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
